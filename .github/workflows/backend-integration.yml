name: Backend integration
on:
  push:
    branches: [ feature/clinica-integral ]
  pull_request:
    branches: [ main, master ]
jobs:
  mysql-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: 1234
          MYSQL_DATABASE: clinica
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Wait for MySQL
        run: |
          for i in {1..30}; do
            mysqladmin ping -h127.0.0.1 -uroot -p1234 && break
            sleep 2
          done
      - name: Apply database scripts in documented order
        run: |
          mysql -h127.0.0.1 -uroot -p1234 < sql/clinica.sql
          mysql -h127.0.0.1 -uroot -p1234 < sql/clinica_integral.sql
          mysql -h127.0.0.1 -uroot -p1234 < sql/seguridad_inventario.sql
      - name: Build executable
        run: mvn -B clean package -DskipTests
      - name: Start application and smoke-test authentication
        env:
          CLINICA_BOOTSTRAP_KEY: integration-test-bootstrap-key
          SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/clinica?serverTimezone=America/Bogota&useSSL=false
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: 1234
        run: |
          java -jar target/clinica-0.0.1-SNAPSHOT.jar > /tmp/clinica.log 2>&1 &
          echo $! > /tmp/clinica.pid
          for i in {1..60}; do
            if curl -s -o /dev/null http://127.0.0.1:8080/clinica/v1/auth/login; then break; fi
            sleep 2
          done
          curl -sS -X POST http://127.0.0.1:8080/clinica/v1/auth/bootstrap \
            -H 'Content-Type: application/json' \
            -H 'X-Setup-Key: integration-test-bootstrap-key' \
            -d '{"nombre":"Admin CI","email":"admin@example.test","password":"ClaveSeguraCI2026"}' | tee /tmp/bootstrap.json
          grep -q 'Administrador inicial creado' /tmp/bootstrap.json
          curl -sS -X POST http://127.0.0.1:8080/clinica/v1/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.test","password":"ClaveSeguraCI2026"}' | tee /tmp/login.json
          TOKEN=$(python3 -c "import json; print(json.load(open('/tmp/login.json'))['token'])")
          test -n "$TOKEN"
          curl -fsS http://127.0.0.1:8080/clinica/v1/auth/me -H "Authorization: Bearer $TOKEN" | grep -q 'ADMINISTRADOR'
          curl -fsS -X POST http://127.0.0.1:8080/clinica/v1/auth/logout -H "Authorization: Bearer $TOKEN" | grep -q 'Sesión cerrada'
      - name: Print application logs on failure
        if: failure()
        run: cat /tmp/clinica.log || true
